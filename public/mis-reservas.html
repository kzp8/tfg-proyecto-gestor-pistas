<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Reservas - SPORTLOGIX</title>
    <!-- Carga de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 font-sans text-slate-900">

    <!-- BARRA DE NAVEGACIÓN (Consistente con index.html) -->
    <nav class="sticky top-0 z-50 bg-emerald-700 text-white shadow-md">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <!-- Botón Menú Móvil -->
                <button id="btn-mobile-menu"
                    class="md:hidden text-white focus:outline-none hover:text-emerald-200 transition">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>

                <!-- Logotipo -->
                <div class="flex items-center gap-2">
                    <div class="bg-white p-1 rounded-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-emerald-700" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13 10V3L4 14h7v7l9-11h-7z" />
                        </svg>
                    </div>
                    <span class="text-xl font-black tracking-tight uppercase">SportLogix</span>
                </div>
            </div>

            <!-- Navegación Escritorio -->
            <div class="hidden md:flex items-center gap-8 font-medium">
                <a href="index.html" class="hover:text-emerald-200 transition">Inicio</a>
                <!-- Enlace activo: Mis Reservas -->
                <a href="mis-reservas.html" class="text-emerald-200 border-b-2 border-emerald-200 transition">Mis
                    Reservas</a>

                <!-- Espacio para el botón de admin si corresponde -->
                <div class="contenedor-admin"></div>

                <!-- Perfil y Salir -->
                <div class="flex items-center gap-3">
                    <div
                        class="h-9 w-9 bg-emerald-800 rounded-full flex items-center justify-center border-2 border-emerald-400 shadow-inner">
                        <span class="text-xs font-bold uppercase inicial-usuario">?</span>
                    </div>
                    <button
                        class="btn-logout text-xs bg-emerald-800/50 hover:bg-red-600 px-3 py-1 rounded-lg transition">Salir</button>
                </div>
            </div>
        </div>

        <!-- Menú Móvil Desplegable -->
        <div id="mobile-menu"
            class="md:hidden hidden bg-emerald-800 text-white px-6 py-4 space-y-4 shadow-inner border-t border-emerald-600/50">
            <a href="index.html" class="block hover:text-emerald-200 transition font-medium">Inicio</a>
            <a href="mis-reservas.html" class="block text-emerald-200 font-medium">Mis Reservas</a>
            <div class="contenedor-admin"></div>
            <div class="border-t border-emerald-700 pt-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div
                        class="h-9 w-9 bg-emerald-700 rounded-full flex items-center justify-center border-2 border-emerald-400 shadow-inner">
                        <span class="text-xs font-bold uppercase inicial-usuario">?</span>
                    </div>
                    <span class="font-bold text-sm nombre-usuario">Usuario</span>
                </div>
                <button
                    class="btn-logout text-xs bg-red-600 hover:bg-red-700 px-3 py-2 rounded-lg transition font-bold shadow-lg">Salir</button>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL: HISTORIAL DE RESERVAS -->
    <main class="container mx-auto px-6 py-10 min-h-[70vh]">
        <div class="mb-12">
            <h1 class="text-4xl font-extrabold text-slate-800 tracking-tight">Mis Reservas</h1>
            <p class="text-lg text-slate-600 mt-2">
                Gestiona tus reservas activas e historial en <span class="font-bold text-emerald-600">SportLogix</span>.
            </p>
        </div>

        <!-- Contenedor dinámico donde se cargarán las tarjetas de reserva vía JavaScript -->
        <div id="contenedor-reservas" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Mensaje de carga inicial -->
            <div class="col-span-full py-10 text-center text-slate-400 animate-pulse">
                Cargando tu historial de reservas...
            </div>
        </div>
    </main>

    <!-- PIE DE PÁGINA -->
    <footer class="mt-20 py-10 border-t border-slate-200 bg-white">
        <div class="container mx-auto px-6 text-center text-slate-400 text-sm font-medium">
            <p>TFG Desarrollo de Aplicaciones Web</p>
            <p class="mt-1 text-slate-500 font-bold">David Raul Rus - Centro SportLogix</p>
        </div>
    </footer>

    <!-- Script específico para la gestión de las reservas del usuario -->
    <script src="js/mis-reservas.js"></script>
</body>

</html>
